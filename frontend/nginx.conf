map $request_uri $robots_header {
  default "noindex, nofollow";
  ~^/(?:\?.*)?$ "index, follow";
  ~^/index\.html(?:\?.*)?$ "index, follow";
  ~^/privacy/?(?:\?.*)?$ "index, follow";
  ~^/(?:business|store)/[^/]+/?(?:\?.*)?$ "index, follow";
}

server {
  listen 127.0.0.1:8080;
  server_tokens off;
  root /var/www/reservorio/frontend;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Robots-Tag $robots_header always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://res.cloudinary.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.stripe.com https://checkout.stripe.com https://api.cloudinary.com; frame-src https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Sitemap dinámico con una URL por cada negocio activo.
  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3000/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy API to backend
  location /api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
  }

  location = /health {
    proxy_pass http://127.0.0.1:3000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|ico|woff2?|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://res.cloudinary.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.stripe.com https://checkout.stripe.com https://api.cloudinary.com; frame-src https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
