<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reservorio — Reservas online, sin esperas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Reservorio te ayuda a reservar cita con negocios locales en minutos: elige servicio, horario y paga de forma segura.">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23005bbf'/%3E%3Cg%20fill='none'%20stroke='%23ffffff'%20stroke-width='4'%20stroke-linecap='round'%3E%3Cpath%20d='M18%2026h28'/%3E%3Cpath%20d='M20%2012v8'/%3E%3Cpath%20d='M44%2012v8'/%3E%3Cpath%20d='M18%2034h28'/%3E%3Cpath%20d='M18%2042h20'/%3E%3C/g%3E%3Ccircle%20cx='47'%20cy='47'%20r='7'%20fill='%23ffd54a'/%3E%3C/svg%3E">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Reservorio",
    "description": "Reserva cita online con negocios locales: elige servicio, horario y paga de forma segura.",
    "inLanguage": "es",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "/?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('reservorio_theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <script>
    window.__APP_CONFIG__ = window.__APP_CONFIG__ || {};
    window.__APP_CONFIG__.apiUrl = window.__APP_CONFIG__.apiUrl || '/api';
  </script>
  <app-root></app-root>
</body>
</html>
