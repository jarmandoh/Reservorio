<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Reservorio · Reserva cita online en tus negocios favoritos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <meta
      name="description"
      content="Encuentra negocios locales, consulta horarios y reserva citas online en Colombia. Elige tu servicio, confirma tu horario y organiza tu visita sin esperas."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://reservorio.app/" />
    <meta property="og:title" content="Reservorio · Reserva cita online en tus negocios favoritos" />
    <meta
      property="og:description"
      content="Encuentra negocios locales, consulta disponibilidad y reserva tu cita online en minutos. Gratis y sin esperas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reservorio.app/" />
    <meta property="og:image" content="https://reservorio.app/assets/imgs/reservorio-logo.jpg" />
    <meta property="og:image:alt" content="Logo de Reservorio" />
    <meta property="og:site_name" content="Reservorio" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reservorio · Reserva cita online en tus negocios favoritos" />
    <meta
      name="twitter:description"
      content="Encuentra negocios locales, consulta horarios y reserva citas online en Colombia."
    />
    <meta name="twitter:image" content="https://reservorio.app/assets/imgs/reservorio-logo.jpg" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Reservorio",
        "description": "Reserva cita online con negocios locales: elige servicio, horario y paga de forma segura.",
        "url": "https://reservorio.app/",
        "inLanguage": "es",
        "publisher": {
          "@type": "Organization",
          "name": "Reservorio",
          "url": "https://reservorio.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://reservorio.app/assets/imgs/reservorio-logo.jpg"
          }
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://reservorio.app/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Fuentes no bloqueantes: preload + swap. Material Icons con display opcional embebido en CSS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=swap" rel="stylesheet" />
    </noscript>
    <!-- Preload de la fuente base (Inter, usada por el body). Manrope se carga
         bajo demanda: solo la usan las páginas de negocio/storefront. -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('reservorio_theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script>
      window.__APP_CONFIG__ = window.__APP_CONFIG__ || {};
      window.__APP_CONFIG__.apiUrl = window.__APP_CONFIG__.apiUrl || '/api';
      window.__APP_CONFIG__.storyDataUrl = window.__APP_CONFIG__.storyDataUrl || '/assets/data/test-story.json';
      window.__APP_CONFIG__.supabaseUrl = window.__APP_CONFIG__.supabaseUrl || '';
      window.__APP_CONFIG__.supabasePublishableKey = window.__APP_CONFIG__.supabasePublishableKey || '';
    </script>
    <app-root></app-root>
  </body>
</html>
