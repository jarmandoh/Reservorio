<dialog #mapDialog role="dialog" aria-modal="true" aria-labelledby="map-modal-title" class="map-dialog">
  <div class="dialog-header">
    <h3 id="map-modal-title" class="text-lg font-bold">Selecciona un punto en el mapa</h3>
    <button class="close-btn" (click)="close()" aria-label="Cerrar mapa">✕</button>
  </div>

  <div class="dialog-body">
    <!-- Contenedor del mapa de Leaflet -->
    <div #mapContainer class="map-container" role="application" aria-label="Mapa interactivo"></div>
  </div>

  <div class="dialog-footer">
    @if (selectedCoords()) {
      <span class="coords-info">
        Lat: <strong>{{ selectedCoords()?.lat?.toFixed(5) }}</strong
        >, Lng: <strong>{{ selectedCoords()?.lng?.toFixed(5) }}</strong>
      </span>
      <button class="btn-confirm" (click)="confirmSelection()" aria-label="Confirmar ubicación">Confirmar Selección</button>
    } @else {
      <span class="coords-info placeholder">Haz clic en el mapa para marcar un punto</span>
    }
  </div>
</dialog>
