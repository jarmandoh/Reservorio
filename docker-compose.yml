services:
  redis:
    image: redis:7-alpine
    container_name: reservorio-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - reservorio-net
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: reservorio-db
    environment:
      POSTGRES_USER: reservorio
      POSTGRES_PASSWORD: reservorio_pass
      POSTGRES_DB: reservorio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    networks:
      - reservorio-net
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservorio -d reservorio"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservorio-backend
    env_file: ./backend/.env
    environment:
      PORT: 3000
      NODE_ENV: production
      # En producción estos valores vienen de .env.production (copiado a backend/.env) y
      # validateRuntimeConfig abortará si JWT_SECRET/ADMIN_PIN son débiles.
      DATABASE_URL: ${DATABASE_URL:-postgres://reservorio:reservorio_pass@db:5432/reservorio}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PIN: ${ADMIN_PIN}
      ADMIN_PIN_HASH: ${ADMIN_PIN_HASH}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:80}
      FRONTEND_URL: ${FRONTEND_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Pool tuning (PgBouncer compatible)
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      PG_POOL_IDLE_TIMEOUT: ${PG_POOL_IDLE_TIMEOUT:-10000}
      PG_STATEMENT_TIMEOUT: ${PG_STATEMENT_TIMEOUT:-10000}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      # Google OAuth (configurar en .env o aquí)
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
      # GOOGLE_REDIRECT_URI: ""
      # GOOGLE_TOKENS_KEY: ""
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reservorio-net
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reservorio-frontend
    environment:
      API_URL: ${API_URL:-/api}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reservorio-net
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: postgres:16-alpine
    container_name: reservorio-backup
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: reservorio
      PGPASSWORD: reservorio_pass
      PGDATABASE: reservorio
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reservorio-net
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: >
      sh -c '
      while true; do
        ts=$(date +%Y%m%d-%H%M%S);
        pg_dump -Fc -Z 9 -f "/backups/reservorio-$ts.dump" "$PGDATABASE" || echo "backup failed at $ts";
        find /backups -name "reservorio-*.dump" -mtime +14 -delete;
        if [ -n "$BACKUP_S3_BUCKET" ] && [ -x "/usr/local/bin/backup-offsite.sh" ]; then
          BACKUP_S3_BUCKET="$BACKUP_S3_BUCKET" /usr/local/bin/backup-offsite.sh /backups || echo "offsite backup failed at $ts";
        fi;
        sleep 86400;
      done'

  # Offsite sync opcional (P3): si BACKUP_S3_BUCKET está definido, sincroniza ./backups a S3 vía rclone
  # Usa imagen rclone/rclone; monta ./backups y ./backend/scripts/backup-offsite.sh
  backup-offsite:
    image: rclone/rclone:1.66
    container_name: reservorio-backup-offsite
    environment:
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_CRYPT_REMOTE: ${BACKUP_S3_CRYPT_REMOTE:-}
      # rclone config via env: RCLONE_CONFIG_* o monta rclone.conf
    volumes:
      - ./backups:/backups:ro
      - ./backend/scripts/backup-offsite.sh:/backup-offsite.sh:ro
    command: >-
      sh -c 'while true; do if [ -n "$BACKUP_S3_BUCKET" ]; then sh /backup-offsite.sh /backups || echo "offsite sync failed"; fi; sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reservorio-net
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - offsite

networks:
  reservorio-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
