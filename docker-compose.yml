services:
  db:
    image: postgres:16-alpine
    container_name: reservorio-db
    environment:
      POSTGRES_USER: reservorio
      POSTGRES_PASSWORD: reservorio_pass
      POSTGRES_DB: reservorio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    networks:
      - reservorio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservorio -d reservorio"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservorio-backend
    env_file: ./backend/.env
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://reservorio:reservorio_pass@db:5432/reservorio
      JWT_SECRET: ${JWT_SECRET:-cambia_este_valor_por_una_clave_larga_y_segura}
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:80}
      # Google OAuth (configurar en .env o aquí)
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
      # GOOGLE_REDIRECT_URI: ""
      # GOOGLE_TOKENS_KEY: ""
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reservorio-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reservorio-frontend
    environment:
      API_URL: ${API_URL:-/api}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reservorio-net

  backup:
    image: postgres:16-alpine
    container_name: reservorio-backup
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: reservorio
      PGPASSWORD: reservorio_pass
      PGDATABASE: reservorio
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reservorio-net
    entrypoint: >
      sh -c '
      while true; do
        ts=$(date +%Y%m%d-%H%M%S);
        pg_dump -Fc -Z 9 -f "/backups/reservorio-$ts.dump" "$PGDATABASE" || echo "backup failed at $ts";
        find /backups -name "reservorio-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

networks:
  reservorio-net:
    driver: bridge

volumes:
  pgdata:
